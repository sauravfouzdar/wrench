[project]
name = "wrench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.21",
    "PyGithub>=2.3",
    "anthropic>=0.39",
    "openai>=1.54",
    "google-generativeai>=0.8",
    "python-dotenv>=1.0",
]

[project.scripts]
wrench = "wrench.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
